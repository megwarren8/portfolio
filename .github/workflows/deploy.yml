# Publishes this repo to Cloudflare Pages on every push to main.
# One-time setup (creates the Pages project and adds the two secrets this
# workflow needs) lives in ~/Documents/megan-warren-com/setup_cloudflare.sh.
# Until those secrets exist, this workflow skips quietly instead of failing.

name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check that Cloudflare credentials exist
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_API_TOKEN is not set on this repo yet, so the deploy is skipped."
            echo "Run setup_cloudflare.sh from ~/Documents/megan-warren-com to finish setup."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the repo
        if: steps.creds.outputs.ready == 'true'
        uses: actions/checkout@v4

      # The gates. Before this the workflow assembled and deployed with no
      # check of any kind, so a stale count or a bare long-cached asset URL
      # would ship silently.
      - name: The derived blocks match books.json
        if: steps.creds.outputs.ready == 'true'
        run: python3 tools/books_section.py --check
      - name: Every long-cached asset is busted
        if: steps.creds.outputs.ready == 'true'
        run: python3 tests/check_cache_busting.py
      # US spelling as a class, reading visible text only so aria-labelledby
      # is invisible to it and direct quotes keep the speaker's own words.
      - name: US spelling in every shipping word
        if: steps.creds.outputs.ready == 'true'
        run: python3 tests/check_wording.py
      # One rsync line keeps the build tooling off the public site, and that
      # is exactly the kind of line an edit drops silently.
      - name: The build tooling stays off the public site
        if: steps.creds.outputs.ready == 'true'
        run: python3 tests/check_deploy_excludes.py
      # Reports NOT CHECKED on a runner, which has no book repos, and that is
      # correct: it must never read as a pass.
      - name: Covers match the art they came from
        if: steps.creds.outputs.ready == 'true'
        run: python3 tools/covers.py --check

      - name: Assemble the site folder
        if: steps.creds.outputs.ready == 'true'
        run: |
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude _site --exclude .git --exclude .github \
            --exclude README.md --exclude netlify.toml --exclude .gitignore \
            --exclude '*.command' --exclude '*.icns' --exclude run.sh --exclude deploy \
            --exclude worker --exclude tools --exclude tests --exclude cache-exempt.txt

      - name: Deploy to Cloudflare Pages
        if: steps.creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=megan-warren --branch=main --commit-dirty=true
